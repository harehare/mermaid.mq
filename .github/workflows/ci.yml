name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: harehare/setup-mq@v1.1.6
        with:
          bins: test
      - name: Run tests
        run: mq-test mermaid_tests.mq
