<svg xmlns="http://www.w3.org/2000/svg" class="mm mm-auto" viewBox="0 0 675.5 666" width="675.5" height="666" font-family="trebuchet ms, verdana, arial, sans-serif" font-size="14">
<style>.mm-auto .mm-bg{fill:#ffffff;fill:var(--mm-bg,#ffffff);}.mm-auto .mm-text{fill:#333333;fill:var(--mm-fg,#333333);}.mm-auto .mm-node{fill:#ececff;fill:var(--mm-node,#ececff);stroke:#9370db;stroke:var(--mm-stroke,#9370db);stroke-width:1.5}.mm-auto .mm-edge{fill:none;stroke:#333333;stroke:var(--mm-edge,#333333);stroke-width:1.5}.mm-auto .mm-label-bg{fill:#ffffff;fill:var(--mm-bg,#ffffff);fill-opacity:.9}.mm-auto .mm-life{stroke:#999999;stroke:var(--mm-life,#999999);stroke-width:1}.mm-auto .mm-sep,.mm-auto .mm-halo{stroke:#ffffff;stroke:var(--mm-bg,#ffffff);}.mm-auto .mm-mfill{fill:#333333;fill:var(--mm-edge,#333333);stroke:#333333;stroke:var(--mm-edge,#333333);}.mm-auto .mm-mhollow{fill:#ffffff;fill:var(--mm-bg,#ffffff);stroke:#333333;stroke:var(--mm-edge,#333333);}.mm-auto .mm-mline{fill:none;stroke:#333333;stroke:var(--mm-edge,#333333);}.mm-auto .mm-solid{fill:#333333;fill:var(--mm-edge,#333333);stroke:#333333;stroke:var(--mm-edge,#333333);}.mm-auto .mm-ext{fill:#999999;fill:var(--mm-life,#999999);fill-opacity:.3}.mm-auto .mm-band{fill:#ececff;fill:var(--mm-node,#ececff);fill-opacity:.45}.mm-auto .mm-group{fill:#ececff;fill:var(--mm-node,#ececff);stroke:#999999;stroke:var(--mm-life,#999999);fill-opacity:.3;stroke-width:1}@media (prefers-color-scheme: dark){.mm-auto .mm-bg{fill:#1e1e2e;fill:var(--mm-bg,#1e1e2e);}.mm-auto .mm-text{fill:#e6e6f0;fill:var(--mm-fg,#e6e6f0);}.mm-auto .mm-node{fill:#2d2d44;fill:var(--mm-node,#2d2d44);stroke:#8b7fd4;stroke:var(--mm-stroke,#8b7fd4);stroke-width:1.5}.mm-auto .mm-edge{fill:none;stroke:#cfcfe0;stroke:var(--mm-edge,#cfcfe0);stroke-width:1.5}.mm-auto .mm-label-bg{fill:#1e1e2e;fill:var(--mm-bg,#1e1e2e);fill-opacity:.9}.mm-auto .mm-life{stroke:#777777;stroke:var(--mm-life,#777777);stroke-width:1}.mm-auto .mm-sep,.mm-auto .mm-halo{stroke:#1e1e2e;stroke:var(--mm-bg,#1e1e2e);}.mm-auto .mm-mfill{fill:#cfcfe0;fill:var(--mm-edge,#cfcfe0);stroke:#cfcfe0;stroke:var(--mm-edge,#cfcfe0);}.mm-auto .mm-mhollow{fill:#1e1e2e;fill:var(--mm-bg,#1e1e2e);stroke:#cfcfe0;stroke:var(--mm-edge,#cfcfe0);}.mm-auto .mm-mline{fill:none;stroke:#cfcfe0;stroke:var(--mm-edge,#cfcfe0);}.mm-auto .mm-solid{fill:#cfcfe0;fill:var(--mm-edge,#cfcfe0);stroke:#cfcfe0;stroke:var(--mm-edge,#cfcfe0);}.mm-auto .mm-ext{fill:#777777;fill:var(--mm-life,#777777);fill-opacity:.3}.mm-auto .mm-band{fill:#2d2d44;fill:var(--mm-node,#2d2d44);fill-opacity:.45}.mm-auto .mm-group{fill:#2d2d44;fill:var(--mm-node,#2d2d44);stroke:#777777;stroke:var(--mm-life,#777777);fill-opacity:.3;stroke-width:1}}</style>
<rect width="100%" height="100%" class="mm-bg"/>
<defs>
<marker id="mm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="mm-mfill"/></marker>
<marker id="mm-circle" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><circle cx="5" cy="5" r="4" class="mm-mhollow"/></marker>
<marker id="mm-cross" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><path d="M 1 1 L 9 9 M 9 1 L 1 9" class="mm-mline" stroke-width="1.5"/></marker>
<marker id="mm-tri" viewBox="0 0 12 12" refX="11" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M 0 0 L 11 6 L 0 12 z" class="mm-mhollow"/></marker>
<marker id="mm-dia" viewBox="0 0 14 10" refX="13" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="15" orient="auto-start-reverse"><path d="M 0 5 L 6.5 0 L 13 5 L 6.5 10 z" class="mm-mfill"/></marker>
<marker id="mm-odia" viewBox="0 0 14 10" refX="13" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="15" orient="auto-start-reverse"><path d="M 0 5 L 6.5 0 L 13 5 L 6.5 10 z" class="mm-mhollow"/></marker>
</defs>
<rect x="67" y="260" width="406" height="339" rx="4" class="mm-group"/>
<text x="77" y="273" dy="0.35em" class="mm-text" font-size="13">Bank</text>
<line x1="337.8" y1="191" x2="337.8" y2="292" class="mm-edge" marker-end="url(#mm-arrow)"/>
<line x1="302" y1="388" x2="226.8" y2="489" class="mm-edge" marker-end="url(#mm-arrow)"/>
<line x1="374.4" y1="388" x2="451.6" y2="489" class="mm-edge" marker-end="url(#mm-arrow)"/>
<path d="M 502.2 489 Q 562.8 280.3 423.5 191" class="mm-edge" marker-end="url(#mm-arrow)"/>
<rect x="212.8" y="81" width="250" height="110" rx="14" class="mm-node"/>
<circle cx="337.8" cy="81" r="10" class="mm-node"/>
<text x="337.8" y="116" dy="0.35em" text-anchor="middle" class="mm-text" font-weight="bold">Banking Customer</text>
<text x="337.8" y="134" dy="0.35em" text-anchor="middle" class="mm-text" font-size="12" font-style="italic">[Person]</text>
<text x="337.8" y="152" dy="0.35em" text-anchor="middle" class="mm-text" font-size="13">A customer of the bank, with</text>
<text x="337.8" y="170" dy="0.35em" text-anchor="middle" class="mm-text" font-size="13">personal bank accounts.</text>
<rect x="216.5" y="292" width="242.5" height="96" rx="4" class="mm-node"/>
<text x="337.8" y="313" dy="0.35em" text-anchor="middle" class="mm-text" font-weight="bold">Internet Banking System</text>
<text x="337.8" y="331" dy="0.35em" text-anchor="middle" class="mm-text" font-size="12" font-style="italic">[System]</text>
<text x="337.8" y="349" dy="0.35em" text-anchor="middle" class="mm-text" font-size="13">Lets customers view their</text>
<text x="337.8" y="367" dy="0.35em" text-anchor="middle" class="mm-text" font-size="13">accounts and make payments.</text>
<path d="M 81 499 A 110 10 0 0 1 301 499 L 301 575 A 110 10 0 0 1 81 575 Z M 81 499 A 110 10 0 0 0 301 499" class="mm-node mm-ext"/>
<text x="191" y="515" dy="0.35em" text-anchor="middle" class="mm-text" font-weight="bold">Mainframe Banking System</text>
<text x="191" y="533" dy="0.35em" text-anchor="middle" class="mm-text" font-size="12" font-style="italic">[External System DB]</text>
<text x="191" y="551" dy="0.35em" text-anchor="middle" class="mm-text" font-size="13">Stores all of the core</text>
<text x="191" y="569" dy="0.35em" text-anchor="middle" class="mm-text" font-size="13">banking information.</text>
<rect x="382" y="489" width="212.5" height="96" rx="4" class="mm-node mm-ext"/>
<text x="488.3" y="510" dy="0.35em" text-anchor="middle" class="mm-text" font-weight="bold">E-mail System</text>
<text x="488.3" y="528" dy="0.35em" text-anchor="middle" class="mm-text" font-size="12" font-style="italic">[External System]</text>
<text x="488.3" y="546" dy="0.35em" text-anchor="middle" class="mm-text" font-size="13">The internal Microsoft</text>
<text x="488.3" y="564" dy="0.35em" text-anchor="middle" class="mm-text" font-size="13">Exchange e-mail system.</text>
<rect x="317.8" y="231.5" width="40" height="20" class="mm-label-bg"/>
<text x="337.8" y="241.5" dy="0.35em" text-anchor="middle" class="mm-text">Uses</text>
<rect x="191.9" y="428.5" width="145" height="20" class="mm-label-bg"/>
<text x="264.4" y="438.5" dy="0.35em" text-anchor="middle" class="mm-text">Reads from [HTTPS]</text>
<rect x="359.3" y="428.5" width="107.5" height="20" class="mm-label-bg"/>
<text x="413" y="438.5" dy="0.35em" text-anchor="middle" class="mm-text">Sends e-mails</text>
<rect x="447.8" y="300.1" width="130" height="20" class="mm-label-bg"/>
<text x="512.8" y="310.1" dy="0.35em" text-anchor="middle" class="mm-text">Sends e-mails to</text>
<text x="16" y="20" dy="0.35em" class="mm-text" font-weight="bold">System Context diagram for Internet Banking System</text>
</svg>
