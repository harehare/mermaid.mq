<svg xmlns="http://www.w3.org/2000/svg" class="mm mm-auto" viewBox="0 0 240 320" width="240" height="320" font-family="trebuchet ms, verdana, arial, sans-serif" font-size="14">
<style>.mm-auto .mm-bg{fill:#ffffff;fill:var(--mm-bg,#ffffff);}.mm-auto .mm-text{fill:#333333;fill:var(--mm-fg,#333333);}.mm-auto .mm-node{fill:#ececff;fill:var(--mm-node,#ececff);stroke:#9370db;stroke:var(--mm-stroke,#9370db);stroke-width:1.5}.mm-auto .mm-edge{fill:none;stroke:#333333;stroke:var(--mm-edge,#333333);stroke-width:1.5}.mm-auto .mm-label-bg{fill:#ffffff;fill:var(--mm-bg,#ffffff);fill-opacity:.9}.mm-auto .mm-life{stroke:#999999;stroke:var(--mm-life,#999999);stroke-width:1}.mm-auto .mm-sep,.mm-auto .mm-halo{stroke:#ffffff;stroke:var(--mm-bg,#ffffff);}.mm-auto .mm-mfill{fill:#333333;fill:var(--mm-edge,#333333);stroke:#333333;stroke:var(--mm-edge,#333333);}.mm-auto .mm-mhollow{fill:#ffffff;fill:var(--mm-bg,#ffffff);stroke:#333333;stroke:var(--mm-edge,#333333);}.mm-auto .mm-mline{fill:none;stroke:#333333;stroke:var(--mm-edge,#333333);}.mm-auto .mm-solid{fill:#333333;fill:var(--mm-edge,#333333);stroke:#333333;stroke:var(--mm-edge,#333333);}.mm-auto .mm-band{fill:#ececff;fill:var(--mm-node,#ececff);fill-opacity:.45}.mm-auto .mm-group{fill:#ececff;fill:var(--mm-node,#ececff);stroke:#999999;stroke:var(--mm-life,#999999);fill-opacity:.3;stroke-width:1}@media (prefers-color-scheme: dark){.mm-auto .mm-bg{fill:#1e1e2e;fill:var(--mm-bg,#1e1e2e);}.mm-auto .mm-text{fill:#e6e6f0;fill:var(--mm-fg,#e6e6f0);}.mm-auto .mm-node{fill:#2d2d44;fill:var(--mm-node,#2d2d44);stroke:#8b7fd4;stroke:var(--mm-stroke,#8b7fd4);stroke-width:1.5}.mm-auto .mm-edge{fill:none;stroke:#cfcfe0;stroke:var(--mm-edge,#cfcfe0);stroke-width:1.5}.mm-auto .mm-label-bg{fill:#1e1e2e;fill:var(--mm-bg,#1e1e2e);fill-opacity:.9}.mm-auto .mm-life{stroke:#777777;stroke:var(--mm-life,#777777);stroke-width:1}.mm-auto .mm-sep,.mm-auto .mm-halo{stroke:#1e1e2e;stroke:var(--mm-bg,#1e1e2e);}.mm-auto .mm-mfill{fill:#cfcfe0;fill:var(--mm-edge,#cfcfe0);stroke:#cfcfe0;stroke:var(--mm-edge,#cfcfe0);}.mm-auto .mm-mhollow{fill:#1e1e2e;fill:var(--mm-bg,#1e1e2e);stroke:#cfcfe0;stroke:var(--mm-edge,#cfcfe0);}.mm-auto .mm-mline{fill:none;stroke:#cfcfe0;stroke:var(--mm-edge,#cfcfe0);}.mm-auto .mm-solid{fill:#cfcfe0;fill:var(--mm-edge,#cfcfe0);stroke:#cfcfe0;stroke:var(--mm-edge,#cfcfe0);}.mm-auto .mm-band{fill:#2d2d44;fill:var(--mm-node,#2d2d44);fill-opacity:.45}.mm-auto .mm-group{fill:#2d2d44;fill:var(--mm-node,#2d2d44);stroke:#777777;stroke:var(--mm-life,#777777);fill-opacity:.3;stroke-width:1}}</style>
<rect width="100%" height="100%" class="mm-bg"/>
<defs>
<marker id="mm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="mm-mfill"/></marker>
<marker id="mm-circle" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><circle cx="5" cy="5" r="4" class="mm-mhollow"/></marker>
<marker id="mm-cross" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><path d="M 1 1 L 9 9 M 9 1 L 1 9" class="mm-mline" stroke-width="1.5"/></marker>
<marker id="mm-tri" viewBox="0 0 12 12" refX="11" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M 0 0 L 11 6 L 0 12 z" class="mm-mhollow"/></marker>
<marker id="mm-dia" viewBox="0 0 14 10" refX="13" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="15" orient="auto-start-reverse"><path d="M 0 5 L 6.5 0 L 13 5 L 6.5 10 z" class="mm-mfill"/></marker>
<marker id="mm-odia" viewBox="0 0 14 10" refX="13" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="15" orient="auto-start-reverse"><path d="M 0 5 L 6.5 0 L 13 5 L 6.5 10 z" class="mm-mhollow"/></marker>
</defs>
<line x1="110" y1="80" x2="80" y2="140" class="mm-edge" marker-start="url(#mm-tri)"/>
<line x1="130" y1="80" x2="160" y2="140" class="mm-edge" marker-start="url(#mm-tri)"/>
<line x1="80" y1="180" x2="110" y2="240" class="mm-edge" marker-start="url(#mm-dia)"/>
<rect x="81.5" y="40" width="77" height="40" rx="3" class="mm-node"/>
<text x="120" y="60" dy="0.35em" text-anchor="middle" class="mm-text">Animal</text>
<rect x="40" y="140" width="60" height="40" rx="3" class="mm-node"/>
<text x="70" y="160" dy="0.35em" text-anchor="middle" class="mm-text">Dog</text>
<rect x="140" y="140" width="60" height="40" rx="3" class="mm-node"/>
<text x="170" y="160" dy="0.35em" text-anchor="middle" class="mm-text">Cat</text>
<rect x="89" y="240" width="62" height="40" rx="3" class="mm-node"/>
<text x="120" y="260" dy="0.35em" text-anchor="middle" class="mm-text">Tail</text>
<rect x="63.8" y="100" width="62.5" height="20" class="mm-label-bg"/>
<text x="95" y="110" dy="0.35em" text-anchor="middle" class="mm-text">extends</text>
</svg>
